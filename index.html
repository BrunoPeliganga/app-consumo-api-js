<!DOCTYPE html>
<html lang="pt">

<head>
    <!--Meta Tags-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initialscale=1.0">
    <meta name="description"
        content="Loja oficial do Bruno Mars: camisetas, CDs, álbuns, posters e merchandise exclusivo. Produtos originais para fãs do Bruno Mars. Compre online com segurança.">
    <meta name="keywords"
        content="Bruno Mars, loja Bruno Mars, merchandise Bruno Mars, camisetas Bruno Mars, CDs Bruno Mars, álbuns Bruno Mars, posters Bruno Mars, merch oficial, produtos Bruno Mars">
    <meta name="author" content="Loja Oficial Bruno Mars">
    <!--Font, Icon, Lightbox e AJAX link-->
    <link rel="icon" href="img/brunoicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css" rel="stylesheet">

    <!--CSS-->
    <link href="style.css" rel="stylesheet">
    <title>Loja oficial do Bruno Mars</title>
</head>

<body>
    <header class="bg-dark text-light py-3 fixed-top">
        <nav class="container navbar navbar-expand-lg navbar-dark">
            <a class="navbar-brand" href="index.html">
                <img src="img/brunoicon.png" alt="Bruno Mars" class="img-fluid" style="max-width: 80px;">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="offcanvas offcanvas-end bg-dark text-light" id="menuLateral">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title">Bruno Mars</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
                </div>

                <div class="offcanvas-body">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link text-light" href="index.html">Home</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section id="filter-section">
            <h1>Filtrar por Categoria</h1>
            <select id="category-filter">
                <option value="">Todas as Categorias</option>
            </select>
        </section>
        <section id="product-list">
            <h2>Lista de produtos</h2>
            <!-- Produtos serão carregados aqui -->
        </section>
        <div id="order-form">
            <h2>Calcular Valor Total</h2>
            <form id="calc-form">
                <label for="product">Escolha um produto:</label>
                <select id="product" name="product">
                    <!-- Produtos serão carregados aqui -->
                </select>
                <label for="quantity">Quantidade:</label>
                <input type="number" id="quantity" name="quantity" min="1" value="1">
                <button class="btn btn-primary" type="button" id="calculate">Calcular Valor</button>
            </form>
            <div id="total-value">
                <!-- Valor total será exibido aqui -->
            </div>
        </div>
    </main>

    <div id="servico-detalhes" class="service-details">
        <!--Detalhes do serviço selecionado serão exibidos aqui -->
    </div>
    <div id="lightbox" style="display:none;">
        <div class="lightbox-content">
            <span class="close-btn">&times;</span>
            <h2 id="lightbox-title"> Titulo</h2>
            <img id="lightbox-image" src="#" alt="Imagem Lightbox" style="height: 300px;">
            <p id="lightbox-description">Descrisão</p>
            <p id="lightbox-price">Price</p>
        </div>
    </div>

    <!--TOAST - NOTIFICATION-->
    <div class="ts-toast">
        <div class="toast-content">
            <i class="fa-solid fa-exclamation check">
            </i><span class="attention">Atenção</span>
            <div class="message">
                <span class="text text-1">Quantidade inválida, </span>
                <span class="text text-2">Tente novamente</span>
            </div>
        </div>
        <span class="tclose">✖</span>
        <div class="progress"></div>
    </div>
    <!--FIM TOAST - NOTIFICATION-->


    <!--Rodapé do Site-->
    <footer class="bg-dark text-light py-3">
        <div class="container text-center">
            <p class="text-light"> &copy; Bruno Mars 2026 | Todos os direitos reservados</p>
            <div class="mt-3">
                <a href="https://www.facebook.com/brunomars/" class="text-light mx-2" aria-label="Facebook"
                    target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="https://www.youtube.com/channel/UCoUM-UJ7rirJYP8CQ0EIaHA" class="text-light mx-2"
                    aria-label="Twitter" target="_blank"><i class="fab fa-youtube"></i></a>
                <a href="https://www.instagram.com/brunomars/" class="text-light mx-2" aria-label="Instagram"
                    target="_blank"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>
    <!--Fim Rodapé do Site-->

    <!--Script JS-->
    <script src="scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox-plus-jquery.min.js"></script>
</body>

</html>
